<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godzilla Bayawak Run</title>
    <!-- Tailwind CSS for UI controls & responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', cursive, monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Canvas styling */
        #gameCanvas {
            box-shadow: 0 10px 25px -5px rgba(255, 69, 0, 0.2);
            border-radius: 12px;
            display: block;
            width: 100%;
            height: auto;
            max-height: 70vh;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 sm:p-6 overflow-x-hidden">

    <!-- Top Header -->
    <header class="w-full max-w-4xl text-center mb-2 sm:mb-4">
        <h1 class="text-xl sm:text-3xl text-red-500 drop-shadow-[0_2px_10px_rgba(255,0,0,0.8)] tracking-wider mb-2">
            🦖 GODZILLA BAYAWAK 🦖
        </h1>
        <p class="text-[10px] sm:text-xs text-red-300 tracking-wide">
            DESTROY BUILDINGS! DUCK AIRPLANES! RAMPAGE THE CITY!
        </p>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl relative flex flex-col items-center">
        
        <!-- Score Bar Above Canvas -->
        <div class="w-full flex justify-between items-center px-4 py-2 bg-slate-900/90 backdrop-blur rounded-t-xl text-xs sm:text-sm border-b border-red-900/50">
            <div class="text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-trophy"></i>
                <span>HI: <span id="highScoreText">00000</span></span>
            </div>
            <div class="text-red-500 flex items-center gap-2 font-bold">
                <i class="fa-solid fa-fire"></i>
                <span>SCORE: <span id="scoreText">00000</span></span>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="800" height="300" class="border-2 border-red-950"></canvas>

        <!-- Touch Controls for Mobile (Visible on Mobile/Tablet) -->
        <div class="w-full grid grid-cols-2 gap-4 mt-3 sm:hidden">
            <button id="touchDuckBtn" class="bg-red-800 active:bg-red-900 text-white font-bold py-4 rounded-lg shadow-lg flex flex-col items-center justify-center text-sm border-b-4 border-red-950 active:border-b-0 active:translate-y-1 transition-all">
                <i class="fa-solid fa-arrow-down text-2xl mb-1"></i>
                DUCK
            </button>
            <button id="touchJumpBtn" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-4 rounded-lg shadow-lg flex flex-col items-center justify-center text-sm border-b-4 border-emerald-900 active:border-b-0 active:translate-y-1 transition-all">
                <i class="fa-solid fa-arrow-up text-2xl mb-1"></i>
                JUMP
            </button>
        </div>

        <!-- Onscreen Overlay Messages -->
        <div id="gameOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm rounded-xl p-4 text-center">
            <div id="overlayContent" class="space-y-4 max-w-md">
                <div class="text-4xl sm:text-6xl mb-2 animate-bounce">🦖</div>
                <h2 id="overlayTitle" class="text-lg sm:text-2xl text-red-500 font-bold tracking-widest drop-shadow-[0_0_10px_rgba(255,0,0,0.8)]">PRESS SPACE TO RAMPAGE</h2>
                <p id="overlaySub" class="text-[10px] sm:text-xs text-slate-300 leading-relaxed">
                    Jump over Skyscrapers! Duck under Jet Airplanes!
                </p>
                <div class="pt-2">
                    <button id="startBtn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-lg text-xs sm:text-sm shadow-lg border-b-4 border-red-900 active:border-b-0 active:translate-y-1 transition-all">
                        UNLEASH BAYAWAK
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Desktop Controls Instruction Footer -->
    <footer class="w-full max-w-4xl text-center text-[10px] sm:text-xs text-slate-400 mt-3 sm:mt-6 bg-slate-900/60 p-3 rounded-lg border border-slate-800">
        <span class="hidden sm:inline">
            <span class="bg-slate-800 px-2 py-1 rounded text-red-400">SPACE</span> or <span class="bg-slate-800 px-2 py-1 rounded text-red-400">UP ARROW</span> = Jump &nbsp;|&nbsp; 
            <span class="bg-slate-800 px-2 py-1 rounded text-red-400">DOWN ARROW</span> = Duck
        </span>
        <span class="sm:hidden">
            Tap screen buttons to Jump or Duck!
        </span>
    </footer>

    <!-- Game Logic JavaScript -->
    <script>
        // --- Game Setup & Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const scoreText = document.getElementById('scoreText');
        const highScoreText = document.getElementById('highScoreText');
        const gameOverlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const startBtn = document.getElementById('startBtn');
        const touchJumpBtn = document.getElementById('touchJumpBtn');
        const touchDuckBtn = document.getElementById('touchDuckBtn');

        // Game State Variables
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let score = 0;
        let highScore = localStorage.getItem('godzilla_bayawak_highscore') || 0;
        let gameSpeed = 6;
        const INITIAL_SPEED = 6;
        const MAX_SPEED = 14;
        let frameCount = 0;

        // Display Highscore initial format
        highScoreText.textContent = String(Math.floor(highScore)).padStart(5, '0');

        // World Physics Settings
        const GRAVITY = 0.65;
        const GROUND_Y = 240; // Ground height level on 300px tall canvas

        // --- Keyboard Controls ---
        const keys = {
            jump: false,
            duck: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState !== 'PLAYING') {
                    startGame();
                } else {
                    keys.jump = true;
                }
            }
            if (e.code === 'ArrowDown') {
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    keys.duck = true;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                keys.jump = false;
            }
            if (e.code === 'ArrowDown') {
                keys.duck = false;
            }
        });

        // --- Touch / Button Controls ---
        startBtn.addEventListener('click', startGame);

        touchJumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') keys.jump = true;
            else startGame();
        });
        touchJumpBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys.jump = false;
        });

        touchDuckBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') keys.duck = true;
        });
        touchDuckBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            keys.duck = false;
        });

        // Click on overlay canvas to start
        gameOverlay.addEventListener('click', (e) => {
            if (e.target === gameOverlay && gameState !== 'PLAYING') {
                startGame();
            }
        });

        // --- Sound Generator (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(320, this.ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e){}
            }

            playScore() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch(e){}
            }

            playHit() {
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 0.3);

                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e){}
            }
        }

        const soundFX = new SoundFX();

        // --- Game Entities ---

        // 1. Black Godzilla Bayawak (Player)
        class Bayawak {
            constructor() {
                this.x = 70;
                this.y = GROUND_Y;
                this.normalWidth = 68;
                this.normalHeight = 32;
                this.duckWidth = 78;
                this.duckHeight = 18;
                
                this.width = this.normalWidth;
                this.height = this.normalHeight;

                this.velocityY = 0;
                this.jumpStrength = -12.5;
                this.isGrounded = true;
                this.isDucking = false;

                this.animFrame = 0;
                this.animTimer = 0;
                this.atomicTimer = 0;
                this.showAtomicBreath = false;
            }

            reset() {
                this.x = 70;
                this.y = GROUND_Y - this.normalHeight;
                this.width = this.normalWidth;
                this.height = this.normalHeight;
                this.velocityY = 0;
                this.isGrounded = true;
                this.isDucking = false;
            }

            update() {
                // Duck logic
                if (keys.duck && this.isGrounded) {
                    this.isDucking = true;
                    this.width = this.duckWidth;
                    this.height = this.duckHeight;
                } else {
                    this.isDucking = false;
                    this.width = this.normalWidth;
                    this.height = this.normalHeight;
                }

                // Jump logic
                if (keys.jump && this.isGrounded) {
                    this.velocityY = this.jumpStrength;
                    this.isGrounded = false;
                    soundFX.playJump();
                }

                // Gravity Application
                this.velocityY += GRAVITY;
                this.y += this.velocityY;

                // Ground Collision
                const currentGround = GROUND_Y - this.height;
                if (this.y >= currentGround) {
                    this.y = currentGround;
                    this.velocityY = 0;
                    this.isGrounded = true;
                }

                // Atomic Fire Breath Animation Timer
                this.atomicTimer++;
                if (this.atomicTimer > 35) {
                    this.showAtomicBreath = true;
                    if (this.atomicTimer > 50) {
                        this.showAtomicBreath = false;
                        this.atomicTimer = 0;
                    }
                }

                // Leg movement frame counter
                this.animTimer++;
                if (this.animTimer % 6 === 0) {
                    this.animFrame = (this.animFrame + 1) % 4;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Adjust color based on current score theme for contrast
                const currentScore = Math.floor(score);
                const isBlackTheme = Math.floor(currentScore / 1000) % 2 === 1;
                
                const skinColor = isBlackTheme ? '#171923' : '#0f172a'; // Black body
                const bellyColor = isBlackTheme ? '#2d3748' : '#334155'; 
                const spineGlow = isBlackTheme ? '#00f0ff' : '#0284c7'; // Cyan Glow

                if (this.isDucking) {
                    // --- DUCKING GODZILLA BAYAWAK ---
                    // Tail
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.moveTo(0, 10);
                    ctx.quadraticCurveTo(-15, 5, -25, 12);
                    ctx.lineTo(-5, 16);
                    ctx.fill();

                    // Tail Spines
                    ctx.fillStyle = spineGlow;
                    ctx.fillRect(-15, 4, 3, 4);
                    ctx.fillRect(-8, 3, 4, 5);

                    // Main Body
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.roundRect(0, 2, 60, 16, [4, 8, 4, 2]);
                    ctx.fill();

                    // Dorsal Spines (Glowing Back)
                    ctx.fillStyle = spineGlow;
                    ctx.beginPath();
                    ctx.moveTo(10, 2); ctx.lineTo(13, -4); ctx.lineTo(16, 2);
                    ctx.moveTo(25, 2); ctx.lineTo(29, -5); ctx.lineTo(33, 2);
                    ctx.moveTo(40, 2); ctx.lineTo(43, -4); ctx.lineTo(46, 2);
                    ctx.fill();

                    // Belly
                    ctx.fillStyle = bellyColor;
                    ctx.beginPath();
                    ctx.roundRect(8, 11, 48, 5, 2);
                    ctx.fill();

                    // Head
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.moveTo(52, 2);
                    ctx.lineTo(75, 8);
                    ctx.lineTo(72, 16);
                    ctx.lineTo(50, 16);
                    ctx.fill();

                    // Glowing Red Eye
                    ctx.fillStyle = '#ff0033';
                    ctx.beginPath();
                    ctx.arc(63, 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Atomic Fire Flame
                    if (this.showAtomicBreath) {
                        ctx.fillStyle = '#00f0ff';
                        ctx.beginPath();
                        ctx.moveTo(74, 11);
                        ctx.lineTo(88, 8);
                        ctx.lineTo(84, 13);
                        ctx.lineTo(92, 11);
                        ctx.lineTo(74, 15);
                        ctx.fill();
                    }

                    // Low crawling legs
                    ctx.fillStyle = '#0f111a';
                    const legOffset = (this.animFrame % 2 === 0) ? 3 : -3;
                    ctx.fillRect(12 + legOffset, 14, 10, 4);
                    ctx.fillRect(42 - legOffset, 14, 10, 4);

                } else {
                    // --- NORMAL / JUMPING GODZILLA BAYAWAK ---
                    // Spiked Tail
                    const tailWag = Math.sin(frameCount * 0.2) * 4;
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.moveTo(5, 14);
                    ctx.quadraticCurveTo(-15, 5 + tailWag, -28, 16 + tailWag);
                    ctx.lineTo(-2, 22);
                    ctx.fill();

                    // Spines on Tail
                    ctx.fillStyle = spineGlow;
                    ctx.fillRect(-12, 6 + tailWag, 4, 5);
                    ctx.fillRect(-2, 4, 4, 6);

                    // Main Body
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.roundRect(5, 4, 48, 22, [8, 12, 6, 4]);
                    ctx.fill();

                    // Glowing Dorsal Spines (Back Fins)
                    ctx.fillStyle = spineGlow;
                    ctx.beginPath();
                    ctx.moveTo(15, 4); ctx.lineTo(19, -6); ctx.lineTo(23, 4);
                    ctx.moveTo(28, 4); ctx.lineTo(33, -8); ctx.lineTo(38, 4);
                    ctx.moveTo(42, 4); ctx.lineTo(45, -5); ctx.lineTo(48, 4);
                    ctx.fill();

                    // Dark Belly Plate
                    ctx.fillStyle = bellyColor;
                    ctx.beginPath();
                    ctx.roundRect(12, 17, 38, 7, [0, 0, 4, 4]);
                    ctx.fill();

                    // Godzilla Head
                    ctx.fillStyle = skinColor;
                    ctx.beginPath();
                    ctx.moveTo(44, 4);
                    ctx.lineTo(65, 8);
                    ctx.lineTo(63, 22);
                    ctx.lineTo(42, 22);
                    ctx.fill();

                    // Angry Glowing Red Eye
                    ctx.fillStyle = '#ff0033';
                    ctx.beginPath();
                    ctx.arc(55, 10, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(55, 9, 1, 2);

                    // Atomic Breath Flame
                    if (this.showAtomicBreath) {
                        ctx.fillStyle = '#00f0ff';
                        ctx.beginPath();
                        ctx.moveTo(64, 15);
                        ctx.lineTo(82, 10);
                        ctx.lineTo(76, 17);
                        ctx.lineTo(88, 16);
                        ctx.lineTo(64, 20);
                        ctx.fill();

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(64, 16, 12, 2);
                    }

                    // Strong Legs
                    ctx.fillStyle = '#0b0c10';
                    if (this.isGrounded) {
                        if (this.animFrame === 0 || this.animFrame === 2) {
                            ctx.fillRect(12, 20, 8, 12);
                            ctx.fillRect(40, 20, 8, 12);
                        } else {
                            ctx.fillRect(16, 20, 8, 12);
                            ctx.fillRect(36, 20, 8, 12);
                        }
                    } else {
                        // Tucked legs during jump
                        ctx.fillRect(14, 22, 10, 6);
                        ctx.fillRect(38, 22, 10, 6);
                    }
                }

                ctx.restore();
            }

            getBounds() {
                const margin = 4;
                return {
                    x: this.x + margin,
                    y: this.y + margin,
                    width: this.width - (margin * 2),
                    height: this.height - (margin * 2)
                };
            }
        }

        // 2. Obstacles (Buildings to Jump, Jet Airplanes to Duck)
        class Obstacle {
            constructor(type) {
                this.type = type; // 'building', 'plane'
                this.markedForDeletion = false;

                if (type === 'building') {
                    this.width = 32 + Math.random() * 18;
                    this.height = 35 + Math.random() * 25; // Skyscrapers to jump over
                    this.x = canvas.width + this.width;
                    this.y = GROUND_Y - this.height;
                    
                    // Random window layout pattern
                    this.windowColor = Math.random() > 0.4 ? '#fef08a' : '#38bdf8';
                } else if (type === 'plane') {
                    this.width = 52;
                    this.height = 24;
                    this.x = canvas.width + this.width;
                    // Low flying jet requiring ducking, or mid-altitude plane
                    const heights = [GROUND_Y - 38, GROUND_Y - 65];
                    this.y = heights[Math.floor(Math.random() * heights.length)];
                }
            }

            update(speed) {
                this.x -= speed;
                if (this.x + this.width < -20) {
                    this.markedForDeletion = true;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'building') {
                    // City Building / Skyscraper
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(0, 0, this.width, this.height);

                    // Building Border
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, this.width, this.height);

                    // Lit Windows
                    ctx.fillStyle = this.windowColor;
                    const rows = Math.floor(this.height / 10);
                    const cols = Math.floor(this.width / 10);
                    
                    for (let r = 1; r < rows; r++) {
                        for (let c = 1; c < cols; c++) {
                            if ((r + c) % 3 !== 0) {
                                ctx.fillRect(c * 9, r * 9, 4, 5);
                            }
                        }
                    }

                    // Antenna on top
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(this.width / 2, 0);
                    ctx.lineTo(this.width / 2, -8);
                    ctx.stroke();

                } else if (this.type === 'plane') {
                    // Military Jet Airplane
                    ctx.fillStyle = '#94a3b8';
                    ctx.beginPath();
                    ctx.moveTo(0, 12);
                    ctx.lineTo(35, 6);
                    ctx.lineTo(52, 12); // Nose
                    ctx.lineTo(35, 18);
                    ctx.closePath();
                    ctx.fill();

                    // Cockpit Glass
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(32, 7);
                    ctx.lineTo(44, 10);
                    ctx.lineTo(32, 12);
                    ctx.fill();

                    // Wings
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.moveTo(20, 12);
                    ctx.lineTo(10, 0);
                    ctx.lineTo(28, 10);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(20, 12);
                    ctx.lineTo(10, 24);
                    ctx.lineTo(28, 14);
                    ctx.fill();

                    // Jet Thruster Flame
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.moveTo(0, 9);
                    ctx.lineTo(-12, 12);
                    ctx.lineTo(0, 15);
                    ctx.fill();
                }

                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x + 3,
                    y: this.y + 3,
                    width: this.width - 6,
                    height: this.height - 6
                };
            }
        }

        // 3. City Background (Alternates White / Black theme every 1,000 pts)
        class Background {
            constructor() {
                this.clouds = [
                    { x: 120, y: 30, speed: 0.4 },
                    { x: 450, y: 50, speed: 0.2 },
                    { x: 750, y: 25, speed: 0.5 }
                ];
                this.buildings = [
                    { x: 50, width: 60, height: 120 },
                    { x: 180, width: 80, height: 160 },
                    { x: 320, width: 50, height: 100 },
                    { x: 480, width: 90, height: 180 },
                    { x: 650, width: 70, height: 130 },
                    { x: 800, width: 60, height: 150 }
                ];
            }

            update(currentSpeed) {
                // Clouds moving slowly
                this.clouds.forEach(cloud => {
                    cloud.x -= cloud.speed;
                    if (cloud.x < -100) cloud.x = canvas.width + 100;
                });

                // Far background skyline parallax
                this.buildings.forEach(b => {
                    b.x -= currentSpeed * 0.25;
                    if (b.x + b.width < -50) b.x = canvas.width + 50;
                });
            }

            draw(currentScore) {
                // Alternates theme:
                // 0 - 999: White theme (0 % 2 === 0)
                // 1000 - 1999: Black theme (1 % 2 === 1)
                // 2000 - 2999: White theme (2 % 2 === 0) ...
                const isBlackTheme = Math.floor(currentScore / 1000) % 2 === 1;

                let skyGradient, moonColor, moonCrater, cloudColor, buildingBg, buildingWindow, roadBg, roadCurb, roadLine;

                if (isBlackTheme) {
                    // --- BLACK BACKGROUND THEME ---
                    skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    skyGradient.addColorStop(0, '#000000');
                    skyGradient.addColorStop(1, '#111111');

                    moonColor = '#ffffff';
                    moonCrater = '#888888';
                    cloudColor = 'rgba(255, 255, 255, 0.2)';
                    buildingBg = '#18181b';
                    buildingWindow = '#ffffff';
                    roadBg = '#09090b';
                    roadCurb = '#ffffff';
                    roadLine = '#71717a';
                } else {
                    // --- WHITE BACKGROUND THEME ---
                    skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    skyGradient.addColorStop(0, '#ffffff');
                    skyGradient.addColorStop(1, '#f1f5f9');

                    moonColor = '#1e293b';
                    moonCrater = '#475569';
                    cloudColor = 'rgba(148, 163, 184, 0.3)';
                    buildingBg = '#e2e8f0';
                    buildingWindow = '#0f172a';
                    roadBg = '#ffffff';
                    roadCurb = '#020617';
                    roadLine = '#475569';
                }

                // Fill Canvas Background
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Moon / Sun
                ctx.fillStyle = moonColor;
                ctx.beginPath();
                ctx.arc(680, 60, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = moonCrater;
                ctx.beginPath();
                ctx.arc(670, 50, 8, 0, Math.PI * 2);
                ctx.arc(695, 70, 12, 0, Math.PI * 2);
                ctx.fill();

                // Clouds
                ctx.fillStyle = cloudColor;
                this.clouds.forEach(c => {
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.arc(18, -6, 22, 0, Math.PI * 2);
                    ctx.arc(40, 0, 18, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Parallax Skyline Buildings
                ctx.fillStyle = buildingBg;
                this.buildings.forEach(b => {
                    ctx.fillRect(b.x, GROUND_Y - b.height, b.width, b.height);
                    
                    // Windows
                    ctx.fillStyle = buildingWindow;
                    for (let y = GROUND_Y - b.height + 10; y < GROUND_Y - 10; y += 20) {
                        ctx.fillRect(b.x + 10, y, 8, 8);
                        ctx.fillRect(b.x + b.width - 18, y, 8, 8);
                    }
                    ctx.fillStyle = buildingBg;
                });

                // Ground Surface
                ctx.fillStyle = roadBg;
                ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

                // Ground Curb Line
                ctx.fillStyle = roadCurb;
                ctx.fillRect(0, GROUND_Y, canvas.width, 4);

                // Moving Road Lane Markings
                ctx.fillStyle = roadLine;
                const offset = (frameCount * gameSpeed) % 40;
                for (let x = -offset; x < canvas.width; x += 40) {
                    ctx.fillRect(x, GROUND_Y + 16, 20, 4);
                }
            }
        }

        // Instantiate Game Objects
        const player = new Bayawak();
        const bg = new Background();
        let obstacles = [];
        let obstacleTimer = 0;
        let nextObstacleSpawn = 100;

        // --- Core Functions ---

        function startGame() {
            soundFX.init();
            gameState = 'PLAYING';
            score = 0;
            gameSpeed = INITIAL_SPEED;
            obstacles = [];
            obstacleTimer = 0;
            player.reset();
            gameOverlay.classList.add('hidden');
        }

        function gameOver() {
            soundFX.playHit();
            gameState = 'GAMEOVER';

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('godzilla_bayawak_highscore', highScore);
                highScoreText.textContent = String(Math.floor(highScore)).padStart(5, '0');
            }

            // Display Game Over Overlay
            overlayTitle.textContent = "RAMPAGE HALTED";
            overlayTitle.classList.remove('text-red-500');
            overlayTitle.classList.add('text-amber-400');
            overlaySub.innerHTML = `Destruction Score: <span class="text-red-400 font-bold">${Math.floor(score)}</span><br>Press SPACE or Tap to Rampage Again!`;
            startBtn.textContent = "RESTART RAMPAGE";
            gameOverlay.classList.remove('hidden');
        }

        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function spawnObstacle() {
            const types = ['building'];
            if (score > 120) {
                types.push('plane');
            }
            const chosenType = types[Math.floor(Math.random() * types.length)];
            obstacles.push(new Obstacle(chosenType));
        }

        // --- Main Game Loop ---
        function gameLoop() {
            frameCount++;

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Decor with current score theme state
            bg.update(gameState === 'PLAYING' ? gameSpeed : 0);
            bg.draw(Math.floor(score));

            if (gameState === 'PLAYING') {
                // Update Score & Speed Progression
                score += 0.15;
                if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
                    if (frameCount % 60 === 0) soundFX.playScore();
                }

                // Gradually increase speed
                if (gameSpeed < MAX_SPEED) {
                    gameSpeed += 0.001;
                }

                scoreText.textContent = String(Math.floor(score)).padStart(5, '0');

                // Player Update
                player.update();

                // Obstacle Spawning Logic
                obstacleTimer++;
                if (obstacleTimer > nextObstacleSpawn) {
                    spawnObstacle();
                    obstacleTimer = 0;
                    nextObstacleSpawn = Math.floor(Math.random() * 50 + 60) - (gameSpeed * 2);
                    if (nextObstacleSpawn < 45) nextObstacleSpawn = 45;
                }

                // Update & Render Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.update(gameSpeed);
                    obs.draw();

                    // Collision Check
                    if (checkCollision(player.getBounds(), obs.getBounds())) {
                        gameOver();
                    }

                    // Remove off-screen obstacles
                    if (obs.markedForDeletion) {
                        obstacles.splice(i, 1);
                    }
                }
            } else {
                // Static / Idle render during menu/gameover
                for (let obs of obstacles) {
                    obs.draw();
                }
            }

            // Draw Godzilla Bayawak
            player.draw();

            requestAnimationFrame(gameLoop);
        }

        // Window Load Initialization
        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
